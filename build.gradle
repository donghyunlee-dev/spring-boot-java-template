plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.windsoft'
version = '0.0.1-SNAPSHOT'
description = 'spring-boot-java-template'
def mapstructVersion = '1.6.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// ���� ������ Spring Boot ���ø����̼� JAR ������ Ȱ��ȭ�Ѵ�.
tasks.named('bootJar') {
    enabled = true
}

dependencies {
    // �� ���ø����̼��� MVC ��� HTTP ��������Ʈ�� ���� ������ �����Ѵ�.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Apache HttpClient 5�� Spring RestClient�� ������ blocking HTTP Ŀ�ؼ� Ǯ�� �����Ѵ�.
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // ��û ��ü�� Bean Validation ������̼��� ������ �߸��� �Է��� �����Ѵ�.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JPA ����� ��ƼƼ ���ΰ� Repository�� ���� ������ ������ �����Ѵ�.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Querydsl ���� API�� Ÿ�� ������ ���� �ۼ� ����� �����Ѵ�.
    implementation 'com.querydsl:querydsl-core'

    // Jakarta Persistence�� Querydsl ����ü�� JPA ������ Ÿ�� �����ϰ� �ۼ��Ѵ�.
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'

    // ���ø����̼� ���� �� �����ͺ��̽� ��Ű�� ������ ���� �����ϰ� �����Ѵ�.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // Flyway�� MySQL �����ͺ��̽��� ������ �� �ֵ��� �����ͺ��̽��� ������ �߰��Ѵ�.
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // ���ø����̼� ���¿� �ֿ� ��ǥ�� � ȯ�濡 �����Ѵ�.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DTO�� ������ ��ü ������ ���� �ڵ带 ������ ������ �����Ѵ�.
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    // SQL �α׿� ���� ���ε� ���� ���� �ð��� ������ �����ͺ��̽� ������ �����Ѵ�.
    runtimeOnly 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:2.0.1'

    // �ݺ����� �����ڡ�Getter ���� �ڵ带 ������ ������ �����Ѵ�.
    compileOnly 'org.projectlombok:lombok'
